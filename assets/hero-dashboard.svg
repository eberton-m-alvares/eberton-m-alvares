<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="420">
  <defs>
    <!-- Gradients -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2335" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#0d0e15" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1f2335" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(470px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes loading {
      0% { width: 0%; }
      100% { width: 85%; }
    }
    
    .scanner {
      animation: scan 4s infinite linear;
    }
    .grid {
      fill: url(#gridGrad);
    }
    .pulsing-grid {
      animation: pulse 4s infinite ease-in-out;
    }
    .dot-blink {
      animation: blink 2s infinite ease-in-out;
    }
    .float-panel {
      animation: float 6s infinite ease-in-out;
    }
    .load-bar {
      animation: loading 3s forwards cubic-bezier(0.1, 0.8, 0.3, 1);
    }
    
    /* Typography */
    .title-text { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 32px; fill: #00f2fe; letter-spacing: 2px; }
    .subtitle-text { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 14px; fill: #ff0055; letter-spacing: 4px; }
    .label-text { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #8892b0; }
    .value-text { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #ffffff; font-weight: bold; }
    .tech-pill { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #00ff66; }
  </style>

  <!-- Base Background -->
  <rect width="800" height="420" fill="#090a10" rx="12" />
  
  <!-- Cyber Grid Pattern -->
  <g class="pulsing-grid">
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2335" stroke-width="0.5" />
    </pattern>
    <rect width="800" height="420" fill="url(#gridPattern)" rx="12" />
  </g>

  <!-- Futuristic Corner Accents -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#ff0055" stroke-width="3" filter="url(#glowPink)" />
  <path d="M 760 20 L 780 20 L 780 40" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glowCyan)" />
  <path d="M 20 380 L 20 400 L 40 400" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glowCyan)" />
  <path d="M 760 400 L 780 400 L 780 380" fill="none" stroke="#ff0055" stroke-width="3" filter="url(#glowPink)" />

  <!-- Outer Border Panel -->
  <rect x="15" y="15" width="770" height="390" fill="none" stroke="#1f2335" stroke-width="1" rx="10" />

  <g class="float-panel">
    <!-- Header Title -->
    <text x="50" y="65" class="title-text" filter="url(#glowCyan)">EBERTON M. ALVARES</text>
    <text x="52" y="85" class="subtitle-text">AI ARCHITECT // FULL STACK ENGINEER</text>

    <!-- LEFT PANEL: System Specs -->
    <rect x="50" y="115" width="320" height="250" rx="8" fill="#0d0e15" stroke="#1f2335" stroke-width="1.5" />
    <text x="70" y="145" class="label-text">SYS_STATUS:</text>
    <text x="160" y="145" class="value-text" fill="#00ff66" filter="url(#glowCyan)">● OPERATIONAL</text>

    <text x="70" y="175" class="label-text">CLASS:</text>
    <text x="160" y="175" class="value-text">CORE_AI_ORCHESTRATOR</text>

    <text x="70" y="205" class="label-text">PRIMARY_CORE:</text>
    <text x="160" y="205" class="value-text">PYTHON / TYPESCRIPT</text>

    <text x="70" y="235" class="label-text">INTEGRATIONS:</text>
    <text x="160" y="235" class="value-text">META_ADS_API // CRM</text>

    <!-- Progress Load Bar -->
    <text x="70" y="280" class="label-text">SYSTEM LOAD CAPACITY:</text>
    <rect x="70" y="295" width="280" height="8" rx="4" fill="#1f2335" />
    <rect x="70" y="295" width="240" height="8" rx="4" fill="url(#barGrad)" class="load-bar" filter="url(#glowCyan)" />
    <text x="70" y="325" class="label-text">ACTIVE_NODES: [4/4] CONNECTED</text>
    <text x="70" y="345" class="label-text">INFRASTRUCTURE: DOCKER / WSL2</text>

    <!-- RIGHT PANEL: Protocol Decoders -->
    <rect x="430" y="115" width="320" height="250" rx="8" fill="#0d0e15" stroke="#1f2335" stroke-width="1.5" />
    <text x="450" y="145" class="value-text" fill="#ff0055" filter="url(#glowPink)">[ ACTIVE MODULES ]</text>
    
    <!-- Module 1 -->
    <rect x="450" y="165" width="280" height="35" rx="6" fill="#090a10" stroke="#1f2335" stroke-width="1" />
    <circle cx="470" cy="182.5" r="4" fill="#00ff66" class="dot-blink" />
    <text x="490" y="186.5" class="value-text">AI AGENT ORCHESTRATION</text>
    <text x="680" y="186.5" class="tech-pill">98%</text>

    <!-- Module 2 -->
    <rect x="450" y="212" width="280" height="35" rx="6" fill="#090a10" stroke="#1f2335" stroke-width="1" />
    <circle cx="470" cy="229.5" r="4" fill="#00ff66" class="dot-blink" />
    <text x="490" y="233.5" class="value-text">CRM AUTOMATION ENGINE</text>
    <text x="680" y="233.5" class="tech-pill">95%</text>

    <!-- Module 3 -->
    <rect x="450" y="259" width="280" height="35" rx="6" fill="#090a10" stroke="#1f2335" stroke-width="1" />
    <circle cx="470" cy="276.5" r="4" fill="#00f2fe" class="dot-blink" />
    <text x="490" y="280.5" class="value-text">TRAFFIC API GATEWAYS</text>
    <text x="680" y="280.5" class="tech-pill">90%</text>

    <!-- Module 4 -->
    <rect x="450" y="306" width="280" height="35" rx="6" fill="#090a10" stroke="#1f2335" stroke-width="1" />
    <circle cx="470" cy="323.5" r="4" fill="#00f2fe" class="dot-blink" />
    <text x="490" y="327.5" class="value-text">DATABASE TRACKING &amp; LOG</text>
    <text x="680" y="327.5" class="tech-pill">92%</text>
  </g>

  <!-- Laser Scanner Animation Overlay -->
  <rect x="20" y="0" width="760" height="3" fill="url(#scanGrad)" class="scanner" filter="url(#glowCyan)" />
</svg>