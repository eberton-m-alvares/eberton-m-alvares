<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="500">
  <defs>
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a15" />
      <stop offset="50%" stop-color="#020308" />
      <stop offset="100%" stop-color="#0b0d1e" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes scrollGrid {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }
    @keyframes rotateCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateCCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes crtScan {
      0% { transform: translateY(-500px); }
      100% { transform: translateY(500px); }
    }
    @keyframes cyberPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #00f2fe); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 8px #00f2fe); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    /* Classes mapping to animations */
    .bg-grid { fill: url(#gridPattern); }
    .scrolling-grid { animation: scrollGrid 2s infinite linear; }
    .rotate-cw { transform-origin: 750px 280px; animation: rotateCW 12s infinite linear; }
    .rotate-ccw { transform-origin: 750px 280px; animation: rotateCCW 8s infinite linear; }
    .pulse-glow { animation: pulse 2s infinite ease-in-out; }
    .ping { animation: pulse 1s infinite ease-in-out; transform-origin: 510px 230px; }
    .scanline { animation: crtScan 6s infinite linear; }
    .reactor-core { transform-origin: 750px 280px; animation: cyberPulse 3s infinite ease-in-out; }
    .floating-hud { animation: float 5s infinite ease-in-out; }
    
    /* Typography */
    .title-main { font-family: 'Share Tech Mono', monospace; font-size: 40px; fill: #00f2fe; font-weight: bold; letter-spacing: 3px; }
    .title-sub { font-family: 'Share Tech Mono', monospace; font-size: 15px; fill: #ff0055; letter-spacing: 5px; }
    .hud-header { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #00ff66; letter-spacing: 2px; }
    .hud-label { font-family: 'Courier New', monospace; font-size: 11px; fill: #8892b0; }
    .hud-value { font-family: 'Courier New', monospace; font-size: 12px; fill: #ffffff; font-weight: bold; }
    .term-code { font-family: 'Courier New', monospace; font-size: 11px; fill: #00ff66; }
    .tech-pill { font-family: 'Courier New', monospace; font-size: 10px; fill: #00ff66; }
  </style>

  <!-- 1. Widescreen Monitor Frame -->
  <rect width="900" height="500" fill="url(#cyberGrad)" rx="16" stroke="#1f2335" stroke-width="2" />

  <!-- 2. Cyber Horizon Grid (Retro Synthwave Style) -->
  <g opacity="0.15">
    <mask id="gridMask">
      <linearGradient id="fadeGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="white" />
        <stop offset="100%" stop-color="black" />
      </linearGradient>
      <rect x="0" y="280" width="900" height="220" fill="url(#fadeGrad)" />
    </mask>
    <g mask="url(#gridMask)">
      <pattern id="synthGrid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="1" />
      </pattern>
      <g class="scrolling-grid">
        <rect x="0" y="240" width="900" height="300" fill="url(#synthGrid)" />
      </g>
    </g>
  </g>

  <!-- 3. Futuristic UI Borders and Corner Elements -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#ff0055" stroke-width="3" filter="url(#glowPink)" />
  <path d="M 850 30 L 870 30 L 870 50" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glowCyan)" />
  <path d="M 30 450 L 30 470 L 50 470" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glowCyan)" />
  <path d="M 850 470 L 870 470 L 870 450" fill="none" stroke="#ff0055" stroke-width="3" filter="url(#glowPink)" />
  <rect x="25" y="25" width="850" height="450" fill="none" stroke="#1f2335" stroke-width="1" rx="12" />

  <g class="floating-hud">
    <!-- 4. Top Main Title Display -->
    <text x="60" y="80" class="title-main" filter="url(#glowCyan)">EBERTON M. ALVARES</text>
    <text x="62" y="105" class="title-sub">INTELLIGENT SYSTEMS ARCHITECT</text>

    <!-- 5. Left Panel: Live Terminal Diagnostic Log -->
    <rect x="60" y="140" width="340" height="310" rx="8" fill="#07080f" fill-opacity="0.9" stroke="#1f2335" stroke-width="1.5" />
    <path d="M 60 170 L 400 170" stroke="#1f2335" stroke-width="1" />
    <text x="80" y="160" class="hud-header" filter="url(#glowGreen)">&gt; DIAGNOSTIC_SYS_LOG</text>

    <!-- Shell boot sequence simulation -->
    <text x="80" y="200" class="term-code" fill="#a0a0b0">&gt; boot --core=ai_agent_orchestration</text>
    <text x="80" y="220" class="term-code">&gt; [OK] CORE.SYS INITIALIZED (v3.5)</text>
    <text x="80" y="240" class="term-code">&gt; [OK] META_ADS_CONNECTOR: ACTIVE</text>
    <text x="80" y="260" class="term-code" fill="#ff0055">&gt; [OK] WHATSAPP_CRM_PIPELINE: ACTIVE</text>
    <text x="80" y="280" class="term-code">&gt; [OK] DOCKER_STACK_NODES: RUNNING (4/4)</text>
    <text x="80" y="300" class="term-code" fill="#00f2fe">&gt; [OK] POSTGRESQL_TRACKING_SYS: MONITORING</text>
    
    <!-- Stats inside terminal -->
    <rect x="80" y="330" width="300" height="1" fill="#1f2335" />
    <text x="80" y="355" class="hud-label">AI ENGINE LOAD:</text>
    <rect x="190" y="347" width="160" height="8" rx="4" fill="#1f2335" />
    <rect x="190" y="347" width="145" height="8" rx="4" fill="#00f2fe" filter="url(#glowCyan)" />
    <text x="350" y="355" class="tech-pill" fill="#00f2fe">92%</text>

    <text x="80" y="380" class="hud-label">CRM EFFICIENCY:</text>
    <rect x="190" y="372" width="160" height="8" rx="4" fill="#1f2335" />
    <rect x="190" y="372" width="152" height="8" rx="4" fill="#00ff66" filter="url(#glowGreen)" />
    <text x="350" y="380" class="tech-pill" fill="#00ff66">95%</text>

    <text x="80" y="405" class="hud-label">FUNNEL AUTOMATION:</text>
    <rect x="190" y="397" width="160" height="8" rx="4" fill="#1f2335" />
    <rect x="190" y="397" width="138" height="8" rx="4" fill="#ff0055" filter="url(#glowPink)" />
    <text x="350" y="405" class="tech-pill" fill="#ff0055">88%</text>

    <!-- 6. Center Panel: Geolocation / Brazil Coordinates -->
    <rect x="420" y="140" width="220" height="140" rx="8" fill="#07080f" fill-opacity="0.9" stroke="#1f2335" stroke-width="1.5" />
    <path d="M 420 170 L 640 170" stroke="#1f2335" stroke-width="1" />
    <text x="440" y="160" class="hud-header" filter="url(#glowGreen)">&gt; RADAR_GEO_COORDS</text>

    <!-- Map representation (Grid of dots) -->
    <!-- Brazil Outline simplified -->
    <g opacity="0.3" fill="#8892b0">
      <circle cx="530" cy="190" r="1.5" /><circle cx="540" cy="190" r="1.5" /><circle cx="550" cy="190" r="1.5" />
      <circle cx="520" cy="200" r="1.5" /><circle cx="530" cy="200" r="1.5" /><circle cx="540" cy="200" r="1.5" /><circle cx="550" cy="200" r="1.5" /><circle cx="560" cy="200" r="1.5" />
      <circle cx="510" cy="210" r="1.5" /><circle cx="520" cy="210" r="1.5" /><circle cx="530" cy="210" r="1.5" /><circle cx="540" cy="210" r="1.5" /><circle cx="555" cy="210" r="1.5" />
      <circle cx="500" cy="220" r="1.5" /><circle cx="510" cy="220" r="1.5" /><circle cx="520" cy="220" r="1.5" /><circle cx="530" cy="220" r="1.5" /><circle cx="540" cy="220" r="1.5" />
      <circle cx="490" cy="230" r="1.5" /><circle cx="500" cy="230" r="1.5" /><circle cx="510" cy="230" r="1.5" /><circle cx="520" cy="230" r="1.5" />
      <circle cx="500" cy="240" r="1.5" /><circle cx="510" cy="240" r="1.5" />
      <circle cx="515" cy="250" r="1.5" />
    </g>
    <!-- Pulsing coordinate dot for Brazil location -->
    <circle cx="510" cy="230" r="6" fill="#00f2fe" class="ping" filter="url(#glowCyan)" />
    <circle cx="510" cy="230" r="2" fill="#ffffff" />
    <text x="440" y="270" class="hud-label">LOC: PATO BRANCO, PR - BR</text>

    <!-- 7. Center-Bottom Panel: Core Architecture Decoders -->
    <rect x="420" y="295" width="220" height="155" rx="8" fill="#07080f" fill-opacity="0.9" stroke="#1f2335" stroke-width="1.5" />
    <path d="M 420 325 L 640 325" stroke="#1f2335" stroke-width="1" />
    <text x="440" y="315" class="hud-header" filter="url(#glowGreen)">&gt; STACK_REGISTRY</text>
    
    <text x="440" y="350" class="hud-label">LANGUAGES:</text>
    <text x="440" y="365" class="hud-value" fill="#00f2fe">PYTHON // TS // C#</text>
    <text x="440" y="395" class="hud-label">DATABASE &amp; OPS:</text>
    <text x="440" y="410" class="hud-value" fill="#ff0055">POSTGRES // DOCKER</text>

    <!-- 8. Right Panel: Futuristic Animated Tech Reactor Core -->
    <rect x="660" y="140" width="180" height="310" rx="8" fill="#07080f" fill-opacity="0.9" stroke="#1f2335" stroke-width="1.5" />
    <path d="M 660 170 L 840 170" stroke="#1f2335" stroke-width="1" />
    <text x="680" y="160" class="hud-header" filter="url(#glowGreen)">&gt; REACTOR_CORE</text>

    <!-- Rotating Tech Rings -->
    <circle cx="750" cy="280" r="50" fill="none" stroke="#1f2335" stroke-width="2" />
    <circle cx="750" cy="280" r="42" fill="none" stroke="#00f2fe" stroke-dasharray="10 12" stroke-width="2.5" class="rotate-cw" filter="url(#glowCyan)" />
    <circle cx="750" cy="280" r="32" fill="none" stroke="#ff0055" stroke-dasharray="8 6" stroke-width="2" class="rotate-ccw" filter="url(#glowPink)" />
    <circle cx="750" cy="280" r="22" fill="none" stroke="#00ff66" stroke-dasharray="4 4" stroke-width="1.5" class="rotate-cw" filter="url(#glowGreen)" />
    
    <!-- Central Pulsing Core -->
    <circle cx="750" cy="280" r="12" fill="#00f2fe" class="reactor-core" />
    
    <text x="750" y="360" text-anchor="middle" class="hud-label">REACTOR ENGINE</text>
    <text x="750" y="380" text-anchor="middle" class="value-text" fill="#00ff66" filter="url(#glowGreen)">STABLE</text>
  </g>

  <!-- 9. CRT Monitor Scanline Laser sweep -->
  <line x1="25" y1="0" x2="875" y2="0" fill="url(#laserGrad)" stroke="url(#laserGrad)" stroke-width="4" class="scanline" filter="url(#glowCyan)" />
</svg>