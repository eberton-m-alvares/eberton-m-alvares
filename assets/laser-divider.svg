<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%" height="20">
  <defs>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    @keyframes slide {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(800px); }
    }
    .laser {
      animation: slide 3s infinite linear;
    }
    .bg-line {
      stroke: #1a1a2e;
      stroke-width: 2;
    }
  </style>
  <line x1="0" y1="10" x2="800" y2="10" class="bg-line" />
  <rect x="0" y="8" width="400" height="4" fill="url(#laserGrad)" class="laser" />
</svg>