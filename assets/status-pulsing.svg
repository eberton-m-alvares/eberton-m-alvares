<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 30" width="200" height="30">
  <style>
    @keyframes pulse {
      0% { fill: #00ff66; filter: drop-shadow(0 0 2px #00ff66); }
      50% { fill: #008833; filter: drop-shadow(0 0 0px #00ff66); }
      100% { fill: #00ff66; filter: drop-shadow(0 0 2px #00ff66); }
    }
    .status-dot {
      animation: pulse 2s infinite;
    }
    .status-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      fill: #a0a0b0;
      font-weight: bold;
    }
  </style>
  <rect x="0" y="0" width="200" height="30" rx="6" fill="#0d0e15" stroke="#1f2335" stroke-width="1" />
  <circle cx="20" cy="15" r="5" fill="#00ff66" class="status-dot" />
  <text x="35" y="19" class="status-text">STATUS: CODING</text>
</svg>