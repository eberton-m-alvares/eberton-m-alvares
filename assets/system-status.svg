<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="100%" height="80">
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .active-dot {
      fill: #00ff66;
      filter: drop-shadow(0 0 3px #00ff66);
      animation: blink 1.5s infinite;
    }
    .sys-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #00f2fe;
    }
    .sys-val {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #ffffff;
      font-weight: bold;
    }
    .panel-bg {
      fill: #0d0e15;
      stroke: #1f2335;
      stroke-width: 1.5;
    }
  </style>
  <rect x="0" y="0" width="600" height="80" rx="8" class="panel-bg" />
  
  <!-- Column 1 -->
  <circle cx="25" cy="25" r="4" class="active-dot" />
  <text x="40" y="28" class="sys-text">CORE.SYS:</text>
  <text x="110" y="28" class="sys-val">ONLINE (v3.5.0)</text>

  <circle cx="25" cy="55" r="4" class="active-dot" />
  <text x="40" y="58" class="sys-text">AI_AGENTS:</text>
  <text x="110" y="58" class="sys-val">ACTIVE (WP/Nanobot)</text>

  <!-- Column 2 -->
  <circle cx="220" cy="25" r="4" class="active-dot" />
  <text x="235" y="28" class="sys-text">META_ADS_API:</text>
  <text x="325" y="28" class="sys-val">CONNECTED</text>

  <circle cx="220" cy="55" r="4" class="active-dot" />
  <text x="235" y="58" class="sys-text">TRACKING_SYS:</text>
  <text x="325" y="58" class="sys-val">MONITORING</text>

  <!-- Column 3 -->
  <circle cx="435" cy="25" r="4" class="active-dot" />
  <text x="450" y="28" class="sys-text">CRM_CONNECTOR:</text>
  <text x="550" y="28" class="sys-val">ESTABLISHED</text>

  <circle cx="435" cy="55" r="4" class="active-dot" />
  <text x="450" y="58" class="sys-text">DOCKER_NODES:</text>
  <text x="550" y="58" class="sys-val">RUNNING (4/4)</text>
</svg>